# Radar Ofertas — produção
#
# Processos:
#   collector  → coleta de ofertas (singleton)
#   scheduler  → mensagens automáticas
#   worker     → envio unificado (WhatsApp + Telegram, todas as contas)
#   manager    → painel admin (stateless)

x-app-environment: &app-environment
  NODE_ENV: production
  APP_TIMEZONE: ${APP_TIMEZONE:-America/Sao_Paulo}
  REDIS_ENABLED: "true"
  TELEGRAM_ENABLED: "false"
  DATABASE_URL: postgresql://${POSTGRES_USER:-radar}:${POSTGRES_PASSWORD:-radar_secret}@postgres:5432/${POSTGRES_DB:-radar_ofertas}
  REDIS_URL: redis://redis:6379
  WHATSAPP_AUTH_PATH: /app/data/auth_info_baileys
  ML_AUTH_PATH: /app/data/ml_auth
  ML_USE_BROWSER_FALLBACK: ${ML_USE_BROWSER_FALLBACK:-true}
  ML_BROWSER_HEADLESS: ${ML_BROWSER_HEADLESS:-true}

x-app-base: &app-base
  build: .
  restart: unless-stopped
  env_file:
    - .env
  environment:
    <<: *app-environment
  volumes:
    - ./data:/app/data
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-radar_secret}
      POSTGRES_DB: ${POSTGRES_DB:-radar_ofertas}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-radar} -d ${POSTGRES_DB:-radar_ofertas}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    restart: "no"
    env_file:
      - .env
    environment:
      <<: *app-environment
    command: ["npm", "run", "migrate:deploy"]
    depends_on:
      postgres:
        condition: service_healthy

  collector:
    <<: *app-base
    command: ["npx", "tsx", "src/app.ts"]
    environment:
      <<: *app-environment
      SKIP_MIGRATIONS: "true"

  scheduler:
    <<: *app-base
    command: ["npx", "tsx", "src/scheduler.ts"]
    environment:
      <<: *app-environment
      SKIP_MIGRATIONS: "true"

  worker:
    <<: *app-base
    command: ["npx", "tsx", "src/worker.ts"]
    environment:
      <<: *app-environment
      SKIP_MIGRATIONS: "true"
    restart: on-failure
    volumes:
      - ./data:/app/data
      - ./src:/app/src

  manager:
    <<: *app-base
    entrypoint: ["/app/docker/manager-entrypoint.sh"]
    command:
      [
        "npx",
        "tsx",
        "watch",
        "--clear-screen=false",
        "--include",
        "./manager/**",
        "--include",
        "./src/**",
        "manager/server.ts",
      ]
    ports:
      - "${MANAGER_PORT:-3000}:3000"
      - "${MANAGER_NOVNC_PORT:-6080}:${MANAGER_NOVNC_PORT:-6080}"
    environment:
      <<: *app-environment
      MANAGER_PORT: "3000"
      MANAGER_CAN_SPAWN_WORKERS: "false"
      MANAGER_HOT_RELOAD: "true"
      MANAGER_VNC_ENABLED: ${MANAGER_VNC_ENABLED:-false}
      MANAGER_VNC_PORT: ${MANAGER_VNC_PORT:-5900}
      MANAGER_VNC_DISPLAY: ${MANAGER_VNC_DISPLAY:-:99}
      MANAGER_NOVNC_PORT: ${MANAGER_NOVNC_PORT:-6080}
      SKIP_MIGRATIONS: "true"
    volumes:
      - ./data:/app/data
      # Código montado do host — evita rebuild a cada mudança no painel
      - ./manager:/app/manager
      - ./src:/app/src

volumes:
  postgres_data:
  redis_data:
