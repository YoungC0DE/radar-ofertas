# Radar Ofertas — produção
#
# Processos:
#   collector  → coleta de ofertas (singleton)
#   scheduler  → mensagens automáticas
#   worker     → envio unificado (WhatsApp + Telegram, todas as contas)
#   api        → API REST + login ML (noVNC opcional)
#   frontend   → SPA React (nginx) — proxy /api → api

x-app-environment: &app-environment
  NODE_ENV: production
  APP_TIMEZONE: ${APP_TIMEZONE:-America/Sao_Paulo}
  REDIS_ENABLED: "true"
  TELEGRAM_ENABLED: "false"
  DATABASE_URL: postgresql://${POSTGRES_USER:-radar}:${POSTGRES_PASSWORD:-radar_secret}@postgres:5432/${POSTGRES_DB:-radar_ofertas}
  REDIS_URL: redis://redis:6379
  WHATSAPP_AUTH_PATH: /app/data/auth_info_baileys
  ML_AUTH_PATH: /app/data/ml_auth
  ML_USE_BROWSER_FALLBACK: ${ML_USE_BROWSER_FALLBACK:-true}
  ML_BROWSER_HEADLESS: ${ML_BROWSER_HEADLESS:-true}

x-app-build: &app-build
  context: .
  dockerfile: docker/Dockerfile.backend

x-app-base: &app-base
  build: *app-build
  restart: unless-stopped
  env_file:
    - .env
  environment:
    <<: *app-environment
  volumes:
    - ./data:/app/data
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    migrate:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-radar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-radar_secret}
      POSTGRES_DB: ${POSTGRES_DB:-radar_ofertas}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-radar} -d ${POSTGRES_DB:-radar_ofertas}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build: *app-build
    restart: "no"
    env_file:
      - .env
    environment:
      <<: *app-environment
    command: ["npm", "run", "migrate:deploy"]
    depends_on:
      postgres:
        condition: service_healthy

  collector:
    <<: *app-base
    command: ["npx", "tsx", "backend/src/app.ts"]
    environment:
      <<: *app-environment
      SKIP_MIGRATIONS: "true"
    volumes:
      - ./data:/app/data
      - ./backend/src:/app/backend/src

  scheduler:
    <<: *app-base
    command: ["npx", "tsx", "backend/src/scheduler.ts"]
    environment:
      <<: *app-environment
      SKIP_MIGRATIONS: "true"
    volumes:
      - ./data:/app/data
      - ./backend/src:/app/backend/src

  worker:
    <<: *app-base
    command: ["npx", "tsx", "backend/src/worker.ts"]
    environment:
      <<: *app-environment
      SKIP_MIGRATIONS: "true"
    restart: on-failure
    volumes:
      - ./data:/app/data
      - ./backend/src:/app/backend/src

  api:
    <<: *app-base
    entrypoint: ["/app/docker/api-entrypoint.sh"]
    command: ["npx", "tsx", "backend/api/server.ts"]
    expose:
      - "3001"
    ports:
      - "${MANAGER_NOVNC_PORT:-6080}:${MANAGER_NOVNC_PORT:-6080}"
    environment:
      <<: *app-environment
      API_PORT: "3001"
      MANAGER_CAN_SPAWN_WORKERS: "false"
      MANAGER_VNC_ENABLED: ${MANAGER_VNC_ENABLED:-false}
      MANAGER_VNC_PORT: ${MANAGER_VNC_PORT:-5900}
      MANAGER_VNC_DISPLAY: ${MANAGER_VNC_DISPLAY:-:99}
      MANAGER_NOVNC_PORT: ${MANAGER_NOVNC_PORT:-6080}
      SKIP_MIGRATIONS: "true"
    volumes:
      - ./data:/app/data
      - ./backend:/app/backend

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ""
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
